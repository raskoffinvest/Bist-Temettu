name: Fiyat ve AI Portföy Önerisini Yenile

on:
  schedule:
    # Her Pazartesi ~06:17 UTC (~09:17 TR saati). Saat başı/yarımı kaçınmak için
    # kasıtlı olarak düz dakikalar kullanılmadı.
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-price-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fiyat verisini yenile
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run refresh-data

      - name: AI portföy önerisini yenile
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run generate-ai-portfolio

      - name: Değişiklik var mı kontrol et
        id: diff
        run: |
          if git diff --quiet -- js/price-data.json js/ai-portfolio.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit ve push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/price-data.json js/ai-portfolio.json
          git commit -m "Fiyat ve AI portföy önerisini otomatik güncelle"
          git push
