name: Fiyat/Destek-Direnç Verisini Yenile

on:
  schedule:
    # Her Pazartesi ~06:17 UTC (~09:17 TR saati). Saat başı/yarımı kaçınmak için
    # kasıtlı olarak düz dakikalar kullanılmadı.
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-price-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fiyat verisini yenile
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run refresh-data

      - name: Değişiklik var mı kontrol et
        id: diff
        run: |
          if git diff --quiet -- js/price-data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit ve push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/price-data.json
          git commit -m "Fiyat/destek-direnç verisini otomatik güncelle"

          # Bu branch'e workflow çalışırken elle/başka bir commit gelmiş olabilir;
          # push reddedilirse rebase edip tekrar dene (en fazla 5 kez).
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push reddedildi, uzak değişiklikler üzerine rebase edilip tekrar denenecek (deneme $i)..."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done
          echo "::error::5 denemeden sonra push başarısız oldu."
          exit 1
